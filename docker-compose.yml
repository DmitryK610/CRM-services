services:
  # --- Message Broker ---
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
    restart: unless-stopped

  # --- Frontend ---
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8080:80"
    restart: unless-stopped

  # --- API Gateway ---
  gateway:
    image: nginx:latest
    container_name: gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf
      - ./services/users_service/staticfiles:/usr/share/nginx/html/static
    depends_on:
      - frontend
      - users_service
      - clients_service
      - orders_service
      - calculations_service
      - pricelists_service
      - materials_service
      - material_purchases_service
      - audit_service
    restart: unless-stopped

  # --- Users Service ---
  users_service:
    build: ./services/users_service
    env_file:
      - ./services/users_service/.env
    container_name: users_service
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./services/users_service:/usr/src/app
      - ./shared:/usr/src/shared 
    ports:
      - "8001:8000"
    depends_on:
      users_db:
        condition: service_healthy
    restart: unless-stopped
  
  users_db:
    image: mysql:8.0
    container_name: users_db
    volumes:
      - users_db_data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=users_db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=root_password
    ports:
      - "33061:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # --- Clients Service ---
  clients_service:
    build: ./services/clients_service
    env_file:
      - ./services/clients_service/.env
