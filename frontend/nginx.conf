server {
    listen 80; # Nginx inside the container listens on port 80
    server_name localhost; # This is fine for an internal container Nginx

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # --- ADD THIS BLOCK FOR API PROXYING ---
    # This location block will intercept all requests starting with /api/
    # and proxy them to your backend service.
    # 'backend' is the Docker Compose service name for your backend.
    # '8000' is the port your backend (Gunicorn/Django) listens on internally.
    location /api/ {
        proxy_pass https://dkor.pro;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Existing block for Vue.js frontend (History mode) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}


