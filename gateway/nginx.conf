
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Upstream сервисы (внутренние порты в Docker сети)
    upstream users_service {
        server users_service:8000;
    }
    upstream clients_service {
        server clients_service:8000;
    }
    upstream orders_service {
        server orders_service:8000;
    }
    upstream calculations_service {
        server calculations_service:8000;
    }
    upstream pricelists_service {
        server pricelists_service:8000;
    }
    upstream materials_service {
        server materials_service:8000;
    }
    upstream material_purchases_service {
        server material_purchases_service:8000;
    }
    upstream audit_service {
        server audit_service:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Статические файлы для админки Django
        location /static/ {
            proxy_pass http://users_service:8000/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Медиа файлы (если нужны)
        location /media/ {
            proxy_pass http://users_service:8000/media/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API endpoints
        location /api/users/ {
            proxy_pass http://users_service:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/clients/ {
            proxy_pass http://clients_service:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/orders/ {
            proxy_pass http://orders_service:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/calculations/ {
            proxy_pass http://calculations_service:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/pricelists/ {
            proxy_pass http://pricelists_service:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/materials/ {
            proxy_pass http://materials_service:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/material-purchases/ {
            proxy_pass http://material_purchases_service:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/audit/ {
            proxy_pass http://audit_service:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health/ {
            proxy_pass http://users_service:8000/health/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default route - можно добавить стартовую страницу
        location / {
            add_header Content-Type text/plain;
            return 200 'CRM Microservices Gateway\nAPI endpoints available at /api/\n';
        }
    }
}
